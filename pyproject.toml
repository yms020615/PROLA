[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "prola-weather"
version = "0.1.0"
description = "Principal-Orthogonal Low-rank Adaptation for weather downscaling"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.5,<3", "numpy>=1.26", "PyYAML>=6"]

[project.optional-dependencies]
weather = ["einops>=0.8", "huggingface-hub>=0.24", "timm==0.9.0", "xarray>=2024.1", "pandas>=2", "scipy>=1.11", "netCDF4>=1.6", "h5py>=3.10"]

[tool.setuptools.packages.find]
where = ["src"]
